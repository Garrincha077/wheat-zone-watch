name: Wheat Trend Restart Watch
# Telegram smoke-test trigger

on:
  push:
    branches:
      - main
    paths:
      - "wheat_watch.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/wheat-watch.yml"
  workflow_dispatch:
    inputs:
      deliver:
        description: "Send Telegram status on this manual run"
        required: false
        type: boolean
        default: false
      force_notify:
        description: "Send current status even if the stage did not change"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "*/30 0-20 * * 0-5"

permissions:
  contents: read

concurrency:
  group: wheat-trend-restart-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      WHEAT_TICKER: "ZW=F"
      DELIVER: "true" # temporary Telegram smoke test
      FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify || false }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout isolated watcher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore watcher state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wheat-state-${{ github.run_id }}
          restore-keys: |
            wheat-state-

      - name: Evaluate wheat setup
        id: watch
        shell: bash
        run: |
          args=(
            --symbol "$WHEAT_TICKER"
            --state-path ".state/wheat.json"
            --snapshot-path "snapshot.json"
            --report-path "report.md"
          )

          if [ "$DELIVER" = "true" ]; then
            args+=(--deliver)
          fi

          if [ "$FORCE_NOTIFY" = "true" ]; then
            args+=(--force-notify)
          fi

          python wheat_watch.py "${args[@]}"

      - name: Add checklist to run summary
        if: always()
        shell: bash
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save state only when it changed
        if: steps.watch.outputs.state_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wheat-state-${{ github.run_id }}
