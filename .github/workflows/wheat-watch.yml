name: Wheat Trend Restart Watch

on:
  push:
    branches:
      - main
    paths:
      - "wheat_watch.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/wheat-watch.yml"
  workflow_dispatch:
    inputs:
      deliver:
        description: "Send Telegram status on this manual run"
        required: false
        type: boolean
        default: false
      force_notify:
        description: "Send current status even if the stage did not change"
        required: false
        type: boolean
        default: true
  schedule:
    # Chicago SRW Wheat (ZW) regular Globex windows, America/Chicago.
    # CME calendar gate below handles holidays, breaks and special closes.
    - cron: "40 19-23 * * 0-4"
      timezone: "America/Chicago"
    - cron: "40 0-7 * * 1-5"
      timezone: "America/Chicago"
    - cron: "40 8-12 * * 1-5"
      timezone: "America/Chicago"

permissions:
  contents: read

concurrency:
  group: wheat-trend-restart-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      WHEAT_TICKER: "ZW=F"
      DELIVER: ${{ vars.WHEAT_DELIVER != 'false' }}
      FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify || false }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout isolated watcher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Check CME wheat session
        id: market
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          import pandas as pd
          import pandas_market_calendars as mcal

          now = datetime.now(timezone.utc)
          cal = mcal.get_calendar("CME_Agriculture")
          sched = cal.schedule(
              start_date=(now - timedelta(days=1)).date(),
              end_date=(now + timedelta(days=1)).date(),
          )

          is_open = False
          matched = None
          for trade_date, row in sched.iterrows():
              market_open = row.get("market_open")
              market_close = row.get("market_close")
              if pd.isna(market_open) or pd.isna(market_close):
                  continue
              if market_open.to_pydatetime() <= now < market_close.to_pydatetime():
                  break_start = row.get("break_start")
                  break_end = row.get("break_end")
                  in_break = (
                      break_start is not None
                      and break_end is not None
                      and not pd.isna(break_start)
                      and not pd.isna(break_end)
                      and break_start.to_pydatetime() <= now < break_end.to_pydatetime()
                  )
                  if not in_break:
                      is_open = True
                      matched = {
                          "trade_date": str(trade_date.date()),
                          "market_open": market_open.isoformat(),
                          "market_close": market_close.isoformat(),
                      }
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"open={'true' if is_open else 'false'}\n")

          print({
              "now_utc": now.isoformat(),
              "open": is_open,
              "session": matched,
          })
          PY

      - name: Restore watcher state
        if: ${{ github.event_name == 'workflow_dispatch' || ((github.event_name == 'schedule' || github.event_name == 'push') && steps.market.outputs.open == 'true') }}
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wheat-state-v2-${{ github.run_id }}
          restore-keys: |
            wheat-state-v2-

      - name: Evaluate wheat setup
        if: ${{ github.event_name == 'workflow_dispatch' || ((github.event_name == 'schedule' || github.event_name == 'push') && steps.market.outputs.open == 'true') }}
        id: watch
        shell: bash
        run: |
          args=(
            --symbol "$WHEAT_TICKER"
            --state-path ".state/wheat.json"
            --snapshot-path "snapshot.json"
            --report-path "report.md"
          )

          if [ "$DELIVER" = "true" ]; then
            args+=(--deliver)
          fi

          if [ "$FORCE_NOTIFY" = "true" ]; then
            args+=(--force-notify)
          fi

          python wheat_watch.py "${args[@]}"

      - name: Add checklist to run summary
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || ((github.event_name == 'schedule' || github.event_name == 'push') && steps.market.outputs.open == 'true')) }}
        shell: bash
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save state only when it changed
        if: ${{ steps.watch.outputs.state_changed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wheat-state-v2-${{ github.run_id }}

      - name: Explain closed CME wheat market
        if: ${{ github.event_name == 'schedule' && steps.market.outputs.open != 'true' }}
        run: echo "CME Agriculture wheat session is closed; wheat evaluation skipped."

      - name: Push validation only while CME wheat market is closed
        if: ${{ github.event_name == 'push' && steps.market.outputs.open != 'true' }}
        run: echo "Workflow/config validation passed; CME wheat market is closed so push evaluation was skipped."
